  }

  function renderTimeline(age) {
    var html = '';
    for (var a = 0; a <= 90; a += 10) {
      var current = Math.floor(age / 10) * 10;
      var cls = (a === current) ? 'tick now' : 'tick';
      html += '<div class="' + cls + '">' + (a === 0 ? '出生' : a) + '</div>';
    }
    $('timeline').innerHTML = html;
  }

  function renderSide() {
    var s = S;
    var owed = s.cash < 0;
    var cashClass = 'v num' + (owed ? ' neg' : '');
    var cashLabel = owed ? '欠款' : '存款';
    var cashValue = owed ? -s.cash : s.cash;
    var home = homeLines(s).map(function (t) { return '<div>' + t + '</div>'; }).join('');
    var jobLine = s.retired ? '已退休' : (s.job ? s.job.name : (s.age < 16 ? '还没有活干' : '无固定职业'));
    $('side').innerHTML =
      '<div class="stat"><div class="k">' + cashLabel + '</div><div class="' + cashClass + '">' + money(s, Math.abs(cashValue)) + '</div></div>' +
      '<div class="stat"><div class="k">身体</div><div class="v small">' + C.healthLabel(s.health) + '</div></div>' +
      '<div class="stat"><div class="k">家里人</div><div class="v small">' + home + '</div></div>' +
      '<div class="stat"><div class="k">学识</div><div class="v small">' + (C.eduLabel[s.edu] || s.edu) + '<br>' + jobLine + '</div></div>' +
      (s.obsession && C.obsessionById[s.obsession]
        ? '<div class="stat"><div class="k">执念</div><div class="v small want">' + C.obsessionById[s.obsession].t + '</div></div>'
        : '');
  }

  function renderLedger(settle) {
    if (!settle) { $('ledger').innerHTML = ''; return; }
    if (settle.household) { $('ledger').innerHTML = '这一年的开销，由家里承担。'; return; }
    var net = settle.net;
    var spend = settle.living + settle.mortgage + settle.med + (settle.interest || 0);
    var html = '这一年：收入 <b>' + money(S, settle.income) + '</b> · 开销 <b>' + money(S, spend) + '</b> · 结余 <b>' +
      (net < 0 ? '-' : '+') + money(S, Math.abs(net)) + '</b>' + (settle.debt > 0 && net > 0 ? '（先还账）' : '');

    var parts = [];
    if (settle.mortgage > 0) parts.push('还贷 ' + money(S, settle.mortgage));
    if (settle.med > 0) parts.push('看病 ' + money(S, settle.med));
    if (settle.interest > 0) parts.push('欠款利息 ' + money(S, settle.interest));
    if (parts.length) html += '<div class="ledger-2">其中：' + parts.join(' · ') + '</div>';
    if (settle.debt > 0) html += '<div class="ledger-2">账上欠款 ' + money(S, settle.debt) + '</div>';

    $('ledger').innerHTML = html;
  }

  function advance() {
    if (busy || !S) return;
    if (S.dead) { showEnd(); return; }
    busy = true;
    chosen = false;
    var p = E.nextPage(S);
    page = p;
    renderPage(p);
    busy = false;
  }

  function yearHead(p) {
    // 一页可能打包好几年：标成区间，不然「四十岁这年」会挂在「42 岁」下面，读着别扭。
    // 末尾带一个阶段名——玩家需要知道自己在人生哪一段，而不是只有一个数字。
    var st = (C.stageOf && C.stageOf(p.age)) || '';
    var tail = st ? ' · ' + st : '';
    if (p.fromYear && p.fromYear !== p.year) {
      var a0 = p.age - (p.year - p.fromYear);
      return p.fromYear + ' — ' + p.year + ' · ' + a0 + '–' + p.age + ' 岁' + tail;
    }
    return p.year + ' · ' + p.age + ' 岁' + tail;
  }

  function renderPage(p) {
    $('top-age').textContent = p.age + ' 岁';
    $('top-year').textContent = p.fromYear && p.fromYear !== p.year ? (p.fromYear + '—' + p.year) : String(p.year);
    $('top-meta').textContent = C.countries[S.country].name + ' · ' + (S.sex === 'F' ? '女' : '男') + ' · ' + padId(S.seed);

    renderTimeline(p.age);
    renderSide();
    renderLedger(p.settle);

    var html = '<p class="year-note">' + yearHead(p) + '</p>';
    if (p.flavor) html += '<p class="flavor">' + p.flavor + '</p>';
    p.lines.forEach(function (line) {
      html += '<p>' + line + '</p>';
    });
    if (p.kind === 'quiet' && !p.lines.length) {
      html += '<p class="year-note">这几年过得很快，没有什么值得记下。</p>';
    }
    $('narrative').innerHTML = html;

    var d = $('decision');
    d.innerHTML = '';

    if (p.kind === 'event' && p.decision) {
      // 选项改为牌匾式按钮（参考玩家提供的样式图）：去勾选框和序号，
      // 只留米色横匾 + 居中文字。类名 .option 和 data-i 保留，QA/键盘钩子依赖它们。
      var opts = p.decision.choices.map(function (c, i) {
        return '<div class="option" data-i="' + i + '" role="button" tabindex="0">' +
          '<span class="txt">' + c.t + '</span></div>';
      }).join('');
      d.innerHTML = '<div class="decision" data-ev-id="' + (p.decision.id || '') + '">' +
        '<div class="decision-head"><span class="label">选 项</span></div>' +
        opts + '</div>';
      var nodes = d.querySelectorAll('.option');
      for (var i = 0; i < nodes.length; i++) {
        nodes[i].addEventListener('click', onPick);
      }
      $('btn-next').textContent = '先做决定';
      $('btn-next').disabled = true;
      $('btn-next').classList.add('hidden');
    } else {
      $('btn-next').classList.remove('hidden');
      $('btn-next').disabled = false;
      $('btn-next').textContent = p.kind === 'death' ? '合上这一生' : '继续';
    }
  }

  function onPick(e) {
    if (chosen) return;
    var el = e.currentTarget;
    var idx = parseInt(el.getAttribute('data-i'), 10);
    chosen = true;

    var opts = $('decision').querySelectorAll('.option');
    for (var i = 0; i < opts.length; i++) {
      opts[i].classList.add('locked');
      if (parseInt(opts[i].getAttribute('data-i'), 10) === idx) opts[i].classList.add('chosen');
    }

    var res = E.choose(S, idx);
    renderSide();

    var chips = [];
    if (res.deltas.cash) {
      var cashTxt = '钱 ' + (res.deltas.cash > 0 ? '+' : '-') + money(S, Math.abs(res.deltas.cash));
      if (res.deltas.borne) cashTxt += '（家里出）';
      else if (res.intoDebt) cashTxt += '（这笔借的）';
      chips.push(chip(res.deltas.cash > 0 ? 'up' : 'down', cashTxt));
    }
    if (hasDelta(res.deltas.health)) chips.push(chip(res.deltas.health > 0 ? 'up' : 'down', '身体 ' + (res.deltas.health > 0 ? '+' : '') + fmtN(res.deltas.health)));
    if (hasDelta(res.deltas.know)) chips.push(chip(res.deltas.know > 0 ? 'up' : 'down', '学识 ' + (res.deltas.know > 0 ? '+' : '') + fmtN(res.deltas.know)));
    if (hasDelta(res.deltas.rel)) chips.push(chip(res.deltas.rel > 0 ? 'up' : 'down', '关系 ' + (res.deltas.rel > 0 ? '+' : '') + fmtN(res.deltas.rel)));
    if (res.outcome) chips.push(chip(res.outcome === 'win' ? 'win' : 'lose', res.outcome === 'win' ? '这一把赢了' : '这一把没赢'));

    var box = document.createElement('div');
    box.className = 'result';
    box.innerHTML = '<div>' + (res.outcome ? (res.outcome === 'win' ? '赌赢了。' : '没有赌赢。') : '你选了：' + res.label) + '</div>' +
      (chips.length ? '<div class="chips">' + chips.join('') + '</div>' : '');
    $('decision').appendChild(box);

    $('btn-next').classList.remove('hidden');
    $('btn-next').disabled = false;
    $('btn-next').textContent = '继续';
  }

  function chip(cls, text) { return '<span class="chip ' + cls + '">' + text + '</span>'; }

  function onNext() {
    if (!page) return;
    if (page.kind === 'death' || S.dead) { showEnd(); return; }
    if (page.kind === 'event' && !chosen) return;
    advance();
  }

  // ---------- 归档 ----------
  function loadLives() {
    if (MEM) return MEM;
    try { MEM = JSON.parse(localStorage.getItem(STORE) || '[]'); } catch (e) { MEM = []; }
    return MEM;
  }
  // ---------- 签谱：跨局收集 ----------
  function loadDex() {
    if (DEXMEM) return DEXMEM;
    try { DEXMEM = JSON.parse(localStorage.getItem(DEX) || '{}'); } catch (e) { DEXMEM = {}; }
    return DEXMEM;
  }
  function saveDex(ids) {
    var d = loadDex();
    for (var i = 0; i < ids.length; i++) if (!d[ids[i]]) d[ids[i]] = 1;
    DEXMEM = d;
    try { localStorage.setItem(DEX, JSON.stringify(d)); } catch (e) { }
    return d;
  }
  function dexStats() {
    var d = loadDex();
    var byStage = {}, total = 0;
    (C.stages || []).forEach(function (st) { byStage[st.k] = { got: 0, all: 0 }; });
    C.events.forEach(function (e) {
      var st = C.stageOf ? C.stageOf(e.a[0]) : '晚年';
      if (!byStage[st]) byStage[st] = { got: 0, all: 0 };
      byStage[st].all++;
      if (d[e.id]) byStage[st].got++;
      if (d[e.id]) total++;
    });
    return { got: total, all: C.events.length, byStage: byStage, pct: Math.round(total / C.events.length * 100) };
  }

  function shareText(arc) {
    var ta = arc.sex === 'F' ? '她' : '他';
    var v = arc.verdict || {};
    var lines = [];
    lines.push('《此生签》' + arc.name + ' · ' + arc.born + '—' + arc.died + ' · ' + arc.countryName + ' · ' + arc.age + ' 岁' +
      (arc.cause ? ' · ' + arc.cause.t : ''));
    lines.push('「' + (v.a || '') + '。' + (v.b || '') + '」');
    if (arc.ending) lines.push('终局：' + arc.ending.name);
    if (arc.texture) lines.push('这段人生的纹理：' + arc.texture.name);
    if (arc.recap && arc.recap[0]) lines.push(arc.recap[0].replace(/^\d{4} 年，/, ''));
    if (arc.obsession) lines.push('执念：' + arc.obsession.t + '（' + (arc.obsession.done ? '成了' : '没成') + '）');
    if (arc.after) lines.push('身后：' + arc.after);
    lines.push('编号 ' + arc.id);
    return lines.join('\n');
  }

  function saveLife(a) {
    var list = loadLives();
    for (var i = 0; i < list.length; i++) if (list[i].id === a.id && list[i].age === a.age) return false;
    list.unshift({ id: a.id, name: a.name, sex: a.sex, country: a.country, birth: a.birth, born: a.born, died: a.died, age: a.age, verdict: a.verdict, seal: a.seal, cause: a.cause, turns: a.turns, road: a.road, stats: a.stats, countryName: a.countryName, decisions: a.decisions, recap: a.recap, texture: a.texture, miles: a.miles, ledger: a.ledger, wishes: a.wishes, after: a.after, ending: a.ending, done: a.done, proud: a.proud, house: a.house, obsession: a.obsession, at: Date.now() });
    MEM = list;
    try { localStorage.setItem(STORE, JSON.stringify(list.slice(0, 24))); } catch (e) { }
    return true;
  }

  function showEnd(a) {
    ended = true;
    var arc = a || E.buildArchive(S);
    saved = arc;
    try { saveLife(arc); } catch (e) { }
    show('screen-end');

    var ta = arc.sex === 'F' ? '她' : '他';
    var turns = arc.turns.map(function (t) {
      return '<div class="turn"><span class="y">' + t.year + '</span><span>' + t.text + '</span></div>';
    }).join('') || '<div class="turn"><span>' + '这一生没有留下什么决定。' + '</span></div>';

    var road = arc.road ? arc.road.text : '回过头看，好像每一步都是被推着走的。';
    var vA = (arc.verdict && arc.verdict.a) || '';
    var vB = (arc.verdict && arc.verdict.b) || '';
    if (vB && !/[。！？]$/.test(vB)) vB += '。';
    if (arc.seen) saveDex(arc.seen);
    var dex = dexStats();
    var sealChars = arc.seal.split('').map(function (c) { return '<span>' + c + '</span>'; }).join('');

    // ── 纹理：这一生的形状 ──
    var tex = arc.texture;
    var texHtml = '';
    if (tex) {
      texHtml = '<div class="tex">' +
        '<div class="tex-top"><span class="tex-k">这 段 人 生 的 纹 理</span>' +
        '<b class="tex-name">' + tex.name + '</b></div>' +
        '<div class="tex-line">' + tex.line + '</div>' +
        (tex.axes && tex.axes.length ? '<div class="tex-axes">' +
          tex.axes.map(function (x) {
            return '<div class="tx"><span class="tx-l">' + x.l + '</span>' +
              '<i class="tx-bar"><b style="left:' + x.pct + '%"></b></i>' +
              '<span class="tx-r">' + x.r + '</span></div>';
          }).join('') +
          '</div>' : '') +
        '</div>';
    }

    // ── 回首：把里程碑连成一段话 ──
    var recapHtml = (arc.recap && arc.recap.length)
      ? '<div class="sec-label">回 首</div><div class="recap">' +
        arc.recap.map(function (l) { return '<p>' + l + '</p>'; }).join('') + '</div>'
      : '';

    // ── 一生账单 ──
    var led = arc.ledger;
    var acctHtml = '';
    if (led && (led.earn > 0 || led.spend > 0)) {
      var rows = [
        ['一辈子挣了', money(arc, led.earn), ''],
        ['日常开销', money(arc, led.spend), ''],
        ['大事进项', '+' + money(arc, led.gain), 'up'],
        ['大事花销', '-' + money(arc, led.loss), 'down']
      ];
      acctHtml = '<div class="sec-label">一 生 账 单</div><div class="acct">' +
        rows.map(function (r) {
          return '<div class="acct-i"><span class="k">' + r[0] + '</span><span class="v ' + r[2] + '">' + r[1] + '</span></div>';
        }).join('') + '</div>' +
        '<div class="acct-note">' + (led.debtYears > 0
          ? '欠着钱的日子一共 ' + led.debtYears + ' 年，最深的时候欠了 ' + money(arc, led.peakDebt) + '。'
          : '这一生没有欠过钱。') + '</div>';
    }

    // ── 做成了的 / 没来得及的：两栏对照 ──
    // 左边这一栏以前是空的：整页只清点「缺什么」，不写「做成了什么」。
    var wishHtml = '';
    if (arc.done) {
      var doneRows = arc.done.slice(0, 3).map(function (d) { return '<li>' + d + '</li>'; }).join('');
      var miss = (arc.wishes && arc.wishes.length) ? arc.wishes.slice(0, 3) : ['一件也没有'];
      wishHtml = '<div class="sec-label">做 成 了 的 &nbsp;/&nbsp; 没 来 得 及 的</div>' +
        '<div class="cols">' +
        '<div class="col done"><h4>做 成 了</h4><ul>' + doneRows + '</ul></div>' +
        '<div class="col miss"><h4>没 来 得 及</h4><ul>' +
        miss.map(function (w) { return '<li>' + w + '</li>'; }).join('') + '</ul></div>' +
        '</div>';
    } else if (arc.wishes && arc.wishes.length) {
      // 旧存档没有 done 字段，退回原来的写法，别让两栏空着
      wishHtml = '<div class="sec-label">没 做 成 的 事</div><div class="wishes">' +
        arc.wishes.map(function (w) { return '<span>' + w + '</span>'; }).join('') + '</div>';
    }

    // ── 编年：一年一年翻 ──
    var chronHtml = '';
    if (arc.miles && arc.miles.length > 2) {
      chronHtml = '<details class="chron"><summary>这一年一年 · 共 ' + arc.miles.length + ' 条</summary>' +
        '<div class="ch-body">' +
        arc.miles.map(function (m) {
          return '<div class="ch-row" data-k="' + m.kind + '"><span class="ch-y">' + m.age + '</span>' +
            '<span class="ch-t">' + m.text + '</span></div>';
        }).join('') + '</div></details>';
    }

    // ── 首屏四格：只放确实有的 ──
    // 「0 个孩子」对当事人很刺眼，没有就不写。
    var facts = [[arc.age + ' 年', '这一生'], [arc.decisions + '', '次决定']];
    if (arc.stats.kids > 0) facts.push([arc.stats.kids + '', '个孩子']);
    if (arc.house) facts.push(['1', '套房子']);
    if (!arc.house && !(arc.stats.kids > 0)) facts.push([arc.stats.married ? '成家' : '未成家', '']);
    var factsHtml = '<div class="end-facts">' + facts.map(function (x) {
      return '<div class="ef"><div class="n">' + x[0] + '</div><div class="k">' + x[1] + '</div></div>';
    }).join('') + '</div>';

    // ── 终局：这一生最后被归成哪一类 ──
    // 不再用「善终 / 寻常 / 未竟」判决，改成 24 种里的收藏序号。
    var ed = arc.ending;
    var finalHtml = '';
    if (ed) {
      var endIds = (C.ends || []).map(function (e) { return e.id; });
      var endNo = endIds.indexOf(ed.id) + 1;
      finalHtml = '<div class="sec-label">这 一 生 是 怎 么 合 上 的</div>' +
        '<div class="final">' +
        '<div class="fi-top"><span class="fi-tier">终 局 · ' + endNo + ' / ' + endIds.length + '</span></div>' +
        '<div class="fi-name">' + ed.name + '</div>' +
        '<div class="fi-lines">' + (ed.line || []).map(function (l) { return '<p>' + l + '</p>'; }).join('') + '</div>' +
        '</div>';
    }

    // ── 三句话：回望 / 最重的那一步 / 一句画面 ──
    var sayHtml = '<div class="sec-label">三 句 话</div><div class="say">' +
      '<p>' + vA + '。</p>' +
      '<p>' + vB + '</p>' +
      (arc.proud ? '<p class="proud">你确实做到过一件事：<b>' + arc.proud + '</b>。</p>' : '') +
      '</div>';

    // ── 执念：成了和没成都写，没成的那句要带上它的副产品 ──
    var obsHtml = '';
    if (arc.obsession) {
      obsHtml = '<div class="sec-label">执 念</div>' +
        '<div class="obsession ' + (arc.obsession.done ? 'done' : 'miss') + '">' +
        '<div class="ob-t">' + arc.obsession.t + '</div>' +
        '<div class="ob-l">' + (arc.obsession.line || (arc.obsession.done ? '后来真的做到了。' : '后来没有做到。')) + '</div>' +
        '</div>';
    }

    var html =
      '<div class="end-top"><span>人 生 档 案 · 已 归 档</span><span>' + arc.id + '</span></div>' +
      '<div class="end-main"><div class="end-left">' +
      '<h1 class="end-name">' + arc.name + '</h1>' +
      '<div class="end-life"><b>' + arc.born + ' — ' + arc.died + '</b> · ' + arc.countryName + ' · ' +
      (arc.sex === 'F' ? '女' : '男') + ' · <b>' + arc.age + ' 岁</b>' +
      (arc.cause ? '<br>' + arc.cause.t : '') + '</div>' +
      factsHtml +
      finalHtml +
      sayHtml +
      recapHtml +
      wishHtml +
      obsHtml +
      texHtml +
      '<div class="sec-label">三 个 转 折</div>' + turns +
      '<div class="road"><b>未走的路 · </b>' + road + '</div>' +
      (arc.after ? '<div class="after-life"><b>身 后 · </b>' + arc.after + '</div>' : '') +
      '</div><div class="end-right"><div class="seal">' + sealChars + '</div>' +
      '<div class="seal-note">第 ' + (loadLives().length || 1) + ' 次抽样</div></div></div>' +
      // ── 附录下沉：账、档、编年都收进折叠区，首屏只留人和话 ──
      (function () {
        var statsHtml = '<div class="end-stats">' +
          (function () {
            var owed = arc.stats.cash < 0;
            return '<div class="end-stat"><div class="k">' + (owed ? '最后欠款' : '最后存款') + '</div><div class="v' + (owed ? ' neg' : '') + '">' +
              money(arc, Math.abs(arc.stats.cash)) + '</div></div>';
          })() +
          '<div class="end-stat"><div class="k">职业</div><div class="v">' + arc.stats.job + '</div></div>' +
          '<div class="end-stat"><div class="k">学历</div><div class="v">' + arc.stats.edu + '</div></div>' +
          '<div class="end-stat"><div class="k">家庭</div><div class="v">' +
            (arc.stats.married ? '成家' + (arc.stats.kids ? ' · ' + arc.stats.kids + ' 孩' : '')
              : arc.stats.kids ? '未婚 · ' + arc.stats.kids + ' 孩' : '未婚') +
          '</div></div>' +
          '</div>';
        if (!acctHtml) return '';
        return '<details class="chron fold"><summary>账 与 档 · 一生账单 / 存款 / 职业 / 学历</summary>' +
          '<div class="ch-body">' + acctHtml + statsHtml + '</div></details>';
      })() +
      chronHtml +
      '<div class="dex-line">签谱 <b>' + dex.got + '</b> / ' + dex.all + ' · 这一支签走到了 ' + dex.pct + '%</div>' +
      '<div class="end-actions">' +
      '<button class="btn primary" id="end-again">再抽一次</button>' +
      '<button class="btn" id="end-same">同一个起点</button>' +
      '<button class="btn" id="end-share">复制这段签文</button>' +
      '</div>';

    $('end-body').innerHTML = html;

    $('end-again').addEventListener('click', function () { drawScreen(true); });
    $('end-same').addEventListener('click', function () {
      S = E.newLife(newSeed(), arc.birth);
      startGame();
      toast('同一个起点，另一种走法');
    });
    $('end-share').addEventListener('click', function () {
      var txt = shareText(arc);
      var done = function () { toast('签文已复制，可以发给别人'); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(done, function () { fallbackCopy(txt, done); });
      } else fallbackCopy(txt, done);
    });
  }

  function cabinet() {
    show('screen-cabinet');
    var list = loadLives();
    var body = $('cabinet-body');
    var dex = dexStats();
    var bars = (C.stages || []).map(function (st) {
      var d = dex.byStage[st.k] || { got: 0, all: 1 };
      var w = Math.round(d.got / Math.max(1, d.all) * 100);
      return '<div class="dx-row"><span class="dx-k">' + st.k + '</span>' +
        '<span class="dx-bar"><i style="width:' + w + '%"></i></span>' +
        '<span class="dx-v">' + d.got + '/' + d.all + '</span></div>';
    }).join('');
    var dexBlock = '<div class="dex"><div class="dex-head">签 谱 <b>' + dex.got + '</b> / ' + dex.all + '</div>' + bars + '</div>';

    // 纹理收集：十六个格子，见过的写出名字，没见过的留一个空格子
    var seenTex = {};
    list.forEach(function (a) { if (a.texture && a.texture.key) seenTex[a.texture.key] = 1; });
    var texKeys = Object.keys(C.texture || {});
    var texGot = texKeys.filter(function (k) { return seenTex[k]; }).length;
    var texBlock = '<div class="texdex"><div class="dex-head">人 生 纹 理 已 见 <b>' + texGot + '</b> / ' + texKeys.length + '</div>' +
      '<div class="tex-chips">' + texKeys.map(function (k) {
        var on = !!seenTex[k];
        return on
          ? '<span class="tex-chip on">' + C.texture[k].n + '</span>'
          : '<span class="tex-chip off"></span>';
      }).join('') + '</div></div>';

    // 终局收集：按「善终 → 寻常 → 未竟」排，见过的写名字，没见过的留空格子
    var seenEnd = {};
    list.forEach(function (a) { if (a.ending && a.ending.id) seenEnd[a.ending.id] = 1; });
    var rank = { good: 0, plain: 1, hard: 2 };
    var endList = (C.ends || []).slice().sort(function (x, y) {
      return (rank[x.tier] - rank[y.tier]);
    });
    var endGot = endList.filter(function (e) { return seenEnd[e.id]; }).length;
    var endBlock = '<div class="texdex enddex"><div class="dex-head">终 局 已 见 <b>' + endGot + '</b> / ' + endList.length + '</div>' +
      '<div class="tex-chips">' + endList.map(function (e) {
        return seenEnd[e.id]
          ? '<span class="tex-chip on e-' + e.tier + '">' + e.name + '</span>'
          : '<span class="tex-chip off"></span>';
      }).join('') + '</div></div>';

    if (!list.length) {
      body.innerHTML = dexBlock + texBlock + endBlock + '<div class="empty">档案柜是空的。<br>抽一支签，活完一生，这里就会有第一份。</div>';
      return;
    }
    body.innerHTML = dexBlock + texBlock + endBlock + list.map(function (a, i) {
      return '<div class="cab-item" data-i="' + i + '">' +
        '<div><div class="n">' + a.name + '</div><div class="m">' + a.born + ' — ' + a.died + ' · ' + a.age + ' 岁 · ' + a.countryName +
        (a.ending ? ' · ' + a.ending.name : '') + (a.texture ? ' · ' + a.texture.name : '') + '</div></div>' +
        '<div class="v">' + a.verdict.a + '</div></div>';
    }).join('');
    var items = body.querySelectorAll('.cab-item');
    for (var i = 0; i < items.length; i++) {
      items[i].addEventListener('click', function (e) {
        var idx = parseInt(e.currentTarget.getAttribute('data-i'), 10);
        showEnd(list[idx]);
      });
    }
  }

  function fallbackCopy(txt, done) {
    var ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('复制失败，请手动选中'); }
    document.body.removeChild(ta);
  }

  function bind() {
    $('btn-draw').addEventListener('click', doDraw);
    $('tube').addEventListener('click', doDraw);
    $('btn-start').addEventListener('click', startGame);
    $('btn-redraw').addEventListener('click', doDraw);
    $('btn-next').addEventListener('click', onNext);
    $('link-cabinet').addEventListener('click', cabinet);
    $('link-cabinet2').addEventListener('click', cabinet);
    $('cab-back').addEventListener('click', function () { show('screen-draw'); });
    $('link-about').addEventListener('click', function () { $('modal-about').classList.add('show'); });
    $('about-close').addEventListener('click', function () { $('modal-about').classList.remove('show'); });
    $('modal-about').addEventListener('click', function (e) {
      if (e.target === $('modal-about')) $('modal-about').classList.remove('show');
    });
    $('about-body').textContent = C.about;

    document.addEventListener('keydown', function (e) {
      if ($('modal-about').classList.contains('show')) return;
      var tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea') return;
      if (e.key === 'Enter' || e.key === ' ') {
        var btn = $('btn-next');
        if ($('screen-game').classList.contains('active') && !btn.disabled && !btn.classList.contains('hidden')) {
          e.preventDefault(); onNext();
        } else if ($('screen-draw').classList.contains('active') && !$('btn-start').disabled) {
          e.preventDefault(); startGame();
        }
      }
      if ($('screen-game').classList.contains('active') && /^[1-9]$/.test(e.key)) {
        var n = $('decision').querySelector('.option[data-i="' + (parseInt(e.key, 10) - 1) + '"]');
        if (n && !chosen) n.click();
      }
    });
  }


  function debugBoot() {
    var q = new URLSearchParams(location.search);
    var seed = q.get('seed');
    if (!seed) return false;
    if (q.get('nofx') === '1') {
      var st = document.createElement('style');
      st.textContent = '*{animation:none!important;transition:none!important}';
      document.head.appendChild(st);
    }
    var forced = {};
    if (q.get('c')) forced.country = q.get('c');
    if (q.get('fam')) forced.fam = parseInt(q.get('fam'), 10);
    S = E.newLife(parseInt(seed, 10) >>> 0, Object.keys(forced).length ? forced : null);
    var ci = C.countries[S.country];
    document.getElementById('b-country').textContent = ci.name + ' · ' + (S.sex === 'F' ? '女' : '男');
    document.getElementById('b-fam').textContent = ['', '勉强糊口', '普通人家', '过得去', '宽裕', '很宽裕'][S.fam];
    document.getElementById('b-sibs').textContent = birthSibLine(S);
    document.getElementById('b-year').textContent = S.birth.year + ' 年';
    document.getElementById('b-name').textContent = S.name;
    document.getElementById('b-id').textContent = padId(S.seed);
    document.getElementById('birth-card').classList.add('show');
    document.getElementById('btn-start').disabled = false;
    document.getElementById('draw-status').textContent = '签已抽出';
    if (q.get('auto') === '1') {
      startGame();
      var timer = setInterval(function () {
        if (document.getElementById('screen-end').classList.contains('active')) { clearInterval(timer); return; }
        var opt = document.querySelector('#decision .option:not(.locked)');
        if (opt) { opt.click(); return; }
        var btn = document.getElementById('btn-next');
        if (btn && !btn.disabled && !btn.classList.contains('hidden')) btn.click();
      }, 30);
      return true;
    }
    if (q.get('cab') === '1') { cabinet(); return true; }
    if (q.get('play') === null && q.get('at') === null && q.get('want') === null && q.get('end') === null) return true;

    // QA 钩子：?at=<年龄> 停在指定年龄的第一页；?want=<选项文字> 推进到含该选项的决定并选它。
    var at = parseInt(q.get('at') || '0', 10);
    var want = q.get('want');
    if (at || want) {
      var guard = 0;
      while (!S.dead && guard++ < 400) {
        var p1 = E.nextPage(S);
        if (p1.kind === 'end') break;
        if (p1.kind === 'event') {
          // 先渲染再作答，截图才反映真实的那一页
          if (at && S.age >= at) {
            show('screen-game');
            page = p1;
            chosen = false;
            renderPage(p1);
            return true;
          }
          var hit = -1;
          if (want) {
            for (var j = 0; j < p1.decision.choices.length; j++) {
              if (p1.decision.choices[j].t === want) { hit = j; break; }
            }
          }
          if (hit >= 0) {
            show('screen-game');
            page = p1;
            chosen = false;
            renderPage(p1);
            var node = $('decision').querySelector('.option[data-i="' + hit + '"]');
            if (node) node.click();
            return true;
          }
          E.choose(S, 0);
        }
        if (at && S.age >= at) {
          show('screen-game');
          page = p1;
          chosen = false;
          renderPage(p1);
          return true;
        }
      }
    }

    if (q.get('end') === '1') {
      E.autoPlay(S, function () { return 0; });
      show('screen-game');
      showEnd();
      return true;
    }
    var steps = parseInt(q.get('play'), 10) || 0;
    for (var i = 0; i < steps; i++) {
      var p0 = E.nextPage(S);
      if (p0.kind === 'event') E.choose(S, 0);
      if (S.dead) break;
    }
    show('screen-game');
    page = E.nextPage(S);
    chosen = false;
    renderPage(page);
    return true;
  }

  document.addEventListener('DOMContentLoaded', function () {
    bind();
    var n = loadLives().length;
    $('link-cabinet').textContent = '档案柜（' + n + '）';
    if (!debugBoot()) drawScreen(false);
  });
})();

</script>
